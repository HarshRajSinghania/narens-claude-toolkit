[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-fixer"
version = "0.2.0"
description = "Score an MCP server's tool definitions with deterministic lint rules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Naren" }]
dependencies = []

[project.scripts]
mcp-fixer = "mcp_fixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
